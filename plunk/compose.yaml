# Local Plunk stack for Certificate Generator.
# Homelab map (CraveCircle): ~/plunk, ntfy 8083, plunk 8085:80.
# This Mac copy does not join cravecircle_aicookbook and does not use
# app.cravecircle.cc — those hostnames belong to the Homelab tunnel.
name: certgen-plunk

services:
  postgres:
    image: postgres:16-alpine
    container_name: plunk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plunk
      POSTGRES_USER: plunk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plunk"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - plunk

  redis:
    image: redis:7-alpine
    container_name: plunk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - plunk

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: plunk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-plunk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - plunk

  ntfy:
    image: binwiederhier/ntfy:v2.14.0
    container_name: plunk-ntfy
    restart: unless-stopped
    command: serve
    environment:
      TZ: UTC
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_etc:/etc/ntfy
    ports:
      - "127.0.0.1:${NTFY_PORT:-8083}:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - plunk

  plunk:
    image: ghcr.io/useplunk/plunk:sha-fb0363f
    container_name: plunk
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVICE: all
      NODE_ENV: production
      DATABASE_URL: postgresql://plunk:${DB_PASSWORD}@postgres:5432/plunk
      DIRECT_DATABASE_URL: postgresql://plunk:${DB_PASSWORD}@postgres:5432/plunk
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NGINX_PORT: ${NGINX_PORT:-80}
      API_DOMAIN: ${API_DOMAIN}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
      LANDING_DOMAIN: ${LANDING_DOMAIN}
      WIKI_DOMAIN: ${WIKI_DOMAIN}
      USE_HTTPS: ${USE_HTTPS:-false}
      API_URI: ${API_URI}
      DASHBOARD_URI: ${DASHBOARD_URI}
      LANDING_URI: ${LANDING_URI}
      WIKI_URI: ${WIKI_URI}
      AWS_SES_REGION: ${AWS_SES_REGION:-}
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID:-}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_CONFIGURATION_SET_NO_TRACKING: ${SES_CONFIGURATION_SET_NO_TRACKING:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-plunk}
      S3_ACCESS_KEY_SECRET: ${S3_ACCESS_KEY_SECRET}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://127.0.0.1:9000/uploads}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      NTFY_URL: ${NTFY_URL:-http://ntfy/plunk-notifications}
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-false}
      AUTO_PROJECT_DISABLE: ${AUTO_PROJECT_DISABLE:-false}
    ports:
      - "127.0.0.1:${PLUNK_HTTP_PORT:-8085}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${NGINX_PORT:-80}/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks:
      - plunk

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ntfy_cache:
  ntfy_etc:

networks:
  plunk:
    driver: bridge
